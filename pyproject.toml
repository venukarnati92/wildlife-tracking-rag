[project]
name = "wildlife-tracking-rag"
version = "0.1.0"
description = "RAG assistant over Movebank wildlife tracking studies"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "altair>=5.4.1",
    "dlt[duckdb,filesystem]>=1.29.1",
    "duckdb>=1.3.0",
    "httpx>=0.28.1",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.2",
    "minsearch>=0.1.0",
    "numpy>=2.1.0",
    "openai>=1.54.0",
    "pandas>=2.2.3",
    "psycopg[binary]>=3.2.3",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "scikit-learn>=1.5.2",
    "sentence-transformers>=3.2.1",
    "streamlit>=1.39.0",
    "tqdm>=4.66.5",
]

[tool.uv]
package = false
